name: Update jobs

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jobs
        run: python fetch_jobs.py

      - name: Save changes
        run: |
          git config user.name "easyjob-bot"
          git config user.email "easyjob-bot@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "Update jobs"
          git push
